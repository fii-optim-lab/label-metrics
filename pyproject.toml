[project]
name = "label-metrics"
version = "0.1.0"
description = "Fast calculation and aggregation of label-wise metrics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "George Stoica", email = "george.stoica@info.uaic.ro" },
]
maintainers = [
    { name = "George Stoica", email = "george.stoica@info.uaic.ro" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

keywords = [
    "segmentation",
    "metrics",
    "classification",
    "medical imaging",
]

dependencies = [
    "numpy",
    "SimpleITK",
    "tqdm",
    "torch",
]

[project.urls]
Repository = "https://github.com/fii-optim-lab/label-metrics"
Issues = "https://github.com/fii-optim-lab/label-metrics/issues"


dev = [
    "pytest",
    "ruff",
    "build",
]

[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [".venv", "README.md"]
